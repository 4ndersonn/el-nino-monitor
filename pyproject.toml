[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "el-nino-monitor"
version = "0.1.0"
description = "Monitoramento local das anomalias de temperatura do Pacífico equatorial."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "xarray>=2024.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "cartopy>=0.23",
    "pyproj>=3.7,<3.8",
    "netCDF4>=1.6",
    "requests>=2.31",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
